        //agr 500 button pe karna pare to hum uper code ko nahin use karenge kuk wo magaz mari he isliye hum direct niche wala kam karenge
        function clickHandler(color){//color variable accessable he child elemnts ko baghair define kiye uper k functions ki tarah
            // document.body.style.backgroundColor = `${color}` ye kam nahin karega variable value dene k liye

            return function(){   
                document.body.style.backgroundColor = `${color}`//agar lexical scoping pata he aur agar pora closure pata he to ye samjh ayega //Lexical scope—also known as static scope. It means that the scope of a variable is determined by its position in the source code, not by where or when the function is called. Lexical scope means where you write your code determines what variables are accessible.It’s static—you can tell what a function can access just by looking at its position in the source code.

// JavaScript uses lexical scoping, so inner functions can access variables defined in their outer (parent) functions.A closure is created when a function is returned or passed around and it still remembers the variables from its lexical scope—even after the outer function has finished executing.

// It’s a runtime behavior that leverages lexical scope. Here, message is preserved by the returned function—that’s a closure.
                //kuk is k pas parent k variable ka access he
            }
        }
