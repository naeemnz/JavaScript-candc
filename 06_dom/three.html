<script>
    //className aur innerText overwrite karta he direct values ko nahin lagata pehle select kark lata he phir set karta he jubk setAttribute direct set karta he overwrite nahin karta
    const div = document.createElement('div')
    console.log(div);
    div.className = 'main'
    div.id = 'myId' ;//for fun to generate random id
    div.id = Math.round(Math.random() * 10 + 1);
    div.setAttribute('title', 'generated title');
    div.style.backgroundColor = 'red';
    div.style.padding = '15px';
    // div.innerText = 'my text for div';
    const addText = document.createTextNode('my text for div'); 
    div.appendChild(addText);
    document.body.appendChild(div);    
</script>
</html>
