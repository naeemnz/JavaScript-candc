<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style= "background-color: #212121; color: #fff;">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
</body>
<script>
    function addLanguage(languageName){
        const listItem= document.createElement('li');
        listItem.innerHTML = `${languageName}`;
        document.querySelector('.language').appendChild(listItem);
    }
    addLanguage('Python');
    addLanguage('Typescript');
    
    //iskam ko ek optimise tareqe se karne ka tareqa uper wala function he mera matlab, inner html pe mat jao us ki jagah appendChild use karo recommended he
    function addOptiLanguage(langName){
        const li = document.createElement('li');
        //const addText = (document.createTextNode(langName))
        //li.appendChild(addText);
        li.appendChild(document.createTextNode(langName));
        document.querySelector('.language').appendChild(li);
    }
    addOptiLanguage('Golang');

    //Edit
    const secondLang = document.querySelector('li:nth-child(2)');
    //ye ek optimize tariqa nahin he karne ka chote projects k liye sirf sahi he
    //secondLang.innerHTML = 'Mojo';
    //aicha tariqa karne ka ye he jo niche he
    const newLi = document.createElement('li')//pehle create karo
    newLi.textContent = 'Mojo'//phir created me add karo ya dalo, textContent aur innerHTML taqreeban same he
    secondLang.replaceWith(newLi)//phir append karo ya replace

    const firstLang = document.querySelector('li:first-child')
    firstLang.outerHTML = '<li>TypeScript2</li>'

    //Remove 
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()
    
</script>
</html>
