<script>

    //agr humen heading change karni he to with settimeout
    let changeHeading = function(){
        document.querySelector('h2').innerHTML = "Asynchronous JavaScript Examples";
    }
    let settimeoutRef = setTimeout(changeHeading, 3000)

    let doNotChange = document.querySelector('#Stop').addEventListener('click', function(){
        clearTimeout(settimeoutRef);//clearTimeout setTimeout ko rokne ya stop karne k liye he, 
        console.log("Change of heading is stopped!");
        
    })
    
    
</script>
