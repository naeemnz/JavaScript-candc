<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Events</title>
</head>
<body style="background-color: #333333; color: aliceblue;">
    <h2>Amazing Images</h2>
    <div>
            <ul id="Images">
        <li> <img width="200px" height="250px" id="coffee" src="images\pexels-erika-andrade-1358382831-29097908.jpg" alt="coffee" ></li>
        <li> <img width="200px" height="250px" id="horse" src="images\pexels-gasparzaldo-32822357.jpg" alt="horse" ></li> 
        <!-- html men direct onclick="alert('horse')" nahin karna chahiye kuk jub app scale karegi he to ye problem karega y kam karti he chalti hen lekin sahi nahi he, han lekin 
         React (JS library) men ye karsakte hen kuk ye ek sahi tarika he waha karne ka  -->
        <li> <img width="200px" height="250px" id="boot" src="images\pexels-lorenzo-castellino-61076802-33145846.jpg" alt="boot" ></li>
        <li> <img width="200px" height="250px" id="trees" src="images\pexels-reinis-bruzitis-2153679369-33292126.jpg" alt="trees" ></li>
        <li> <img width="200px" height="250px" id="capital" src="images\pexels-sulimansallehi-3883319.jpg" alt="capital" ></li>
        <li><a style="color: aliceblue;" href="https://google.com" id="google">Google</a></li>
    </ul>
    </div>
